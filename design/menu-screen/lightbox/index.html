<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devoxx Lightbox</title>
<script>
  (() => { const p = new URLSearchParams(location.search), d = document.documentElement;
    if (p.get("shape") === "phone") d.classList.add("phone");
    if (p.get("ground") === "dark") d.dataset.ground = "dark"; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="menu" data-mode="rest" aria-label="Devoxx Belgium 2026, the week's talks">
  <section id="stage">
    <!-- The marquee: the week's three arguments, one at a time. Line 1 is the same in all three, so a wipe only
         changes what follows it. The first argument is plain HTML; app.js adds the other two. -->
    <div class="slides" id="slides" aria-roledescription="marquee">
      <div class="slide on">
        <h1 class="lead">
          <span class="w"><span>Devoxx argued about</span> <span>coding agents:</span> <span>how to check, review</span> <span>and contain them.</span></span>
          <span class="p"><span>Devoxx</span> <span>argued about</span> <span>coding agents:</span> <span>how to check,</span> <span>review and</span> <span>contain them.</span></span>
        </h1>
        <p class="start"><span class="sw">Start with</span> <button type="button" class="in">State of Agentic Coding</button><span class="d">Daniela Petruzalek, 48 min</span></p>
      </div>
    </div>
    <div id="view" class="view"></div>
  </section>

  <div class="field">
    <div class="qbox">
      <span class="mirror" aria-hidden="true"></span>
      <input id="q" type="text" autocomplete="off" spellcheck="false" enterkeyhint="search"
             role="combobox" aria-expanded="false" aria-controls="view" aria-autocomplete="list"
             aria-label="Search 205 talks by title, speaker, company or topic" placeholder="Search 205 talks">
      <span class="caret" aria-hidden="true"></span>
    </div>
    <p id="fmeta" class="fmeta d">Devoxx Belgium, 5–9 Oct 2026</p>
  </div>

  <footer class="chrome">
    <nav class="ways" aria-label="Ways in">
      <button type="button" class="hit way" data-go="story">The story</button>
      <button type="button" class="hit way" data-go="picks">Watch first</button>
      <button type="button" class="hit way" data-go="days">By day</button>
    </nav>
    <div class="where d">
      <p id="status" class="status"></p>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>
      <a class="hit textv" href="../../../site/index.html">Text version</a>
    </div>
  </footer>
</main>
<script src="../../menu-variants/data.js"></script>
<script src="app.js"></script>
</body>
</html>
