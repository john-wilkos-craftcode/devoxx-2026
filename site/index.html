<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devoxx Belgium 2026, at the cinema</title>
<meta name="description" content="Every Devoxx Belgium 2026 session, summarised, in the Kinepolis where it happened: pick a talk on the hall screen and walk to your seat.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EEF0EC'/%3E%3Crect width='32' height='11' fill='%23FF48B0'/%3E%3Crect y='11' width='32' height='8' fill='%230078BF'/%3E%3Crect y='19' width='32' height='9' fill='%23FFE800'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cinema.css?v=c305ddd2be">
<link rel="stylesheet" href="inks.css?v=0c93f7b06e">
<noscript><style>.loading, .walks { display: none; }</style></noscript>
</head>
<body>
<nav class="seatbar" id="seatbar" hidden><button class="chip" id="toProg" type="button"><span aria-hidden="true">←</span> Programme</button></nav>
<main class="stage" id="stage">
  <img class="plate" id="plate" alt="">
  <video class="plate" id="clip" muted playsinline preload="auto" hidden></video>
  <div class="overlay" id="overlay"></div>
  <img class="front" id="front" alt="" hidden>
  <div class="tube" id="tube" hidden></div>
  <div class="lap" id="lap" hidden>
    <img class="lap-art" id="lapArt" alt="">
    <div class="lid-hit" id="lidHit" aria-hidden="true" hidden></div>
    <div class="lid-bar" id="lidBar" hidden>
      <button class="chip lid-play" id="lidPlay" type="button" aria-keyshortcuts="K"><span class="glyph">▶ Play</span><kbd aria-hidden="true">K</kbd></button>
      <button class="chip lap-lid" id="lapLid" type="button" aria-keyshortcuts="L">Open the laptop<kbd aria-hidden="true">L</kbd></button>
    </div>
  </div>
  <div class="fade" id="fade"></div>
</main>
<noscript><p class="noscript">This page needs JavaScript. <a href="slop/">Read the text-only version of every talk</a>.</p></noscript>
<div class="dock">
  <span class="status" id="status" role="status" hidden></span>
  <button class="skip" id="skip" type="button" aria-keyshortcuts="Escape" hidden>Skip the walk <kbd aria-hidden="true">Esc</kbd></button>
</div>
<button class="walks" id="walks" type="button" aria-pressed="true">Walks <span class="walks-state">on</span></button>
<div class="loading" id="loading"><div class="loading-sheet"><span class="loading-inks" aria-hidden="true"><i></i><i></i><i></i></span><span class="loading-text">Opening the doors…</span></div></div>
<script src="data.js?v=7df9aec1b2"></script>
<script src="menu.js?v=44acfed20a"></script>
<script type="module" src="cinema.js?v=a73dde662f"></script>
</body>
</html>
