<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devoxx Kino 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root { --night: #0B0A14; --text: #EEEBF7; --dim: #A39CC2; --bulb: #FFC93C; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); overflow: hidden; }
  canvas { display: block; }
  .dev {
    position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; flex-wrap: wrap;
    font: 14px/1 "Source Serif 4", Georgia, serif;
  }
  .dev button {
    background: rgba(20, 18, 36, .7); color: var(--text); border: 1px solid #3A3060; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; font: inherit;
  }
  .dev button[aria-pressed="true"] { background: var(--bulb); color: #17122B; border-color: var(--bulb); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; font: 800 28px/1 "Big Shoulders Display", sans-serif; letter-spacing: .04em; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="loading" id="loading">Lights down…</div>
<div class="dev" id="dev" aria-label="Camera views"></div>
<script src="../data.js"></script>
<script type="module" src="kino.js"></script>
</body>
</html>
